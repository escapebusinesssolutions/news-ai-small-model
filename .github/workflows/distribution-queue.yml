name: TechSignal Distribution Queue

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

concurrency:
  group: techsignal-distribution-queue
  cancel-in-progress: false

permissions:
  contents: write

env:
  TECHSIGNAL_URL: ${{ secrets.TECHSIGNAL_URL }}

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Build synchronized distribution queue
        run: python social_distribution.py
      - name: Persist queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/social_distribution_queue.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh TechSignal distribution queue"
            git push
          fi
