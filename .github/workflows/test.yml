name: Tests

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '*.json'
      - 'requirements.txt'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '**.py'
      - '*.json'
      - 'requirements.txt'
      - '.github/workflows/*.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run full test suite
        env:
          PYTHONPATH: .
        run: pytest -q
