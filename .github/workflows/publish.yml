name: Small Model Publish

on:
  workflow_dispatch:
    inputs:
      topic_index:
        description: "Topic number from topics.json"
        required: false
        default: "0"
      publish:
        description: "Actually create the WordPress post (otherwise dry-run)"
        required: false
        default: "false"
  schedule:
    - cron: '17 6 * * 1,3,5'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run complete pipeline
        env:
          AI_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WORDPRESS_SITE_ID: 257062637
          WORDPRESS_ACCESS_TOKEN: ${{ secrets.WORDPRESS_ACCESS_TOKEN }}
          WORDPRESS_PUBLISH_ENABLED: ${{ inputs.publish == 'true' && 'true' || 'false' }}
          WORDPRESS_DEFAULT_STATUS: draft
        run: python pipeline.py --topic-index "${{ inputs.topic_index || '0' }}" ${{ inputs.publish == 'true' && '--publish' || '' }}

