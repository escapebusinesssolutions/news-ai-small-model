name: Small Model Publish

on:
  workflow_dispatch:
    inputs:
      topic_index:
        description: "Topic number from topics.json (0-29)"
        required: false
        default: "0"
      publish:
        description: "Actually create the WordPress post (otherwise dry-run)"
        required: false
        default: "false"
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: small-model-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run complete pipeline
        env:
          AI_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WORDPRESS_SITE_ID: 257062637
          WORDPRESS_ACCESS_TOKEN: ${{ secrets.WORDPRESS_ACCESS_TOKEN }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_CLIENT_ID: ${{ secrets.WORDPRESS_CLIENT_ID }}
          WORDPRESS_CLIENT_SECRET: ${{ secrets.WORDPRESS_CLIENT_SECRET }}
          WORDPRESS_PUBLISH_ENABLED: ${{ github.event_name == 'schedule' || inputs.publish == 'true' }}
          WORDPRESS_DEFAULT_STATUS: draft
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DAY_OF_YEAR=$(date -u +%j)
            TOPIC_INDEX=$((10#$DAY_OF_YEAR % 30))
            echo "Scheduled run: topic index ${TOPIC_INDEX}"
            python pipeline.py --topic-index "$TOPIC_INDEX" --publish
          else
            python pipeline.py --topic-index "${{ inputs.topic_index || '0' }}" ${{ inputs.publish == 'true' && '--publish' || '' }}
          fi
