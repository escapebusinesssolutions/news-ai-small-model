name: Small Model Publish

on:
  workflow_dispatch:
    inputs:
      topic_index:
        description: "Topic number from topics.json (0-14)"
        required: false
        default: "0"
      publish:
        description: "Run the WordPress publishing path (status is controlled by WORDPRESS_DEFAULT_STATUS secret)"
        required: false
        default: "false"
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: small-model-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run complete pipeline
        env:
          AI_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WORDPRESS_SITE_URL: ${{ secrets.TECHSIGNAL_URL }}
          WORDPRESS_USERNAME: ${{ secrets.TECHSIGNAL_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.TECHSIGNAL_APP_PASSWORD }}
          WORDPRESS_PUBLISH_ENABLED: ${{ github.event_name == 'schedule' || inputs.publish == 'true' }}
          WORDPRESS_DEFAULT_STATUS: ${{ (github.event_name == 'schedule' || inputs.publish == 'true') && 'publish' || (secrets.WORDPRESS_DEFAULT_STATUS || 'draft') }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DAY_OF_YEAR=$(date -u +%j)
            TOPIC_INDEX=$((10#$DAY_OF_YEAR % 15))
            echo "Scheduled run: topic index ${TOPIC_INDEX}"
            python pipeline.py --topic-index "$TOPIC_INDEX" --publish --output validation-report.json
          else
            python pipeline.py --topic-index "${{ inputs.topic_index || '0' }}" ${{ inputs.publish == 'true' && '--publish' || '' }} --output validation-report.json
          fi
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: small-model-validation-report-${{ github.run_id }}
          path: validation-report.json
          if-no-files-found: error
