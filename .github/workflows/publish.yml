name: Small Model Publish

on:
  workflow_dispatch:
    inputs:
      topic_index:
        description: "Topic number from topics.json (0-14)"
        required: false
        default: "0"
      publish:
        description: "Run the WordPress publishing path"
        required: false
        default: "false"
      cleanup_post_ids:
        description: "Optional comma-separated WordPress post IDs to move to trash before publishing"
        required: false
        default: ""
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: small-model-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Clean up superseded posts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cleanup_post_ids != '' }}
        env:
          WORDPRESS_SITE_URL: ${{ secrets.TECHSIGNAL_URL }}
          WORDPRESS_USERNAME: ${{ secrets.TECHSIGNAL_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.TECHSIGNAL_APP_PASSWORD }}
          CLEANUP_POST_IDS: ${{ inputs.cleanup_post_ids }}
        run: |
          python - <<'PY'
          import os
          import requests
          site = os.environ["WORDPRESS_SITE_URL"].rstrip("/")
          auth = (os.environ["WORDPRESS_USERNAME"], os.environ["WORDPRESS_APP_PASSWORD"])
          ids = [x.strip() for x in os.environ["CLEANUP_POST_IDS"].split(",") if x.strip()]
          for post_id in ids:
              response = requests.delete(f"{site}/wp-json/wp/v2/posts/{post_id}", params={"force": "false"}, auth=auth, timeout=30)
              response.raise_for_status()
              print(f"Moved WordPress post {post_id} to trash")
          PY
      - name: Run complete pipeline
        env:
          AI_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WORDPRESS_SITE_URL: ${{ secrets.TECHSIGNAL_URL }}
          WORDPRESS_USERNAME: ${{ secrets.TECHSIGNAL_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.TECHSIGNAL_APP_PASSWORD }}
          WORDPRESS_PUBLISH_ENABLED: ${{ github.event_name == 'schedule' || inputs.publish == 'true' }}
          WORDPRESS_DEFAULT_STATUS: ${{ (github.event_name == 'schedule' || inputs.publish == 'true') && 'publish' || (secrets.WORDPRESS_DEFAULT_STATUS || 'draft') }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DAY_OF_YEAR=$(date -u +%j)
            TOPIC_INDEX=$((10#$DAY_OF_YEAR % 15))
            echo "Scheduled run: topic index ${TOPIC_INDEX}"
            python pipeline.py --topic-index "$TOPIC_INDEX" --publish --output validation-report.json
          else
            python pipeline.py --topic-index "${{ inputs.topic_index || '0' }}" ${{ inputs.publish == 'true' && '--publish' || '' }} --output validation-report.json
          fi
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: small-model-validation-report-${{ github.run_id }}
          path: validation-report.json
          if-no-files-found: error
