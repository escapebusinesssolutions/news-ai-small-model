name: Small Model Publish

on:
  workflow_dispatch:
    inputs:
      topic_index:
        description: "Topic seed index; the topic engine expands this catalogue automatically"
        required: false
        default: "0"
      publish:
        description: "Run the WordPress publishing path"
        required: false
        default: "false"
      cleanup_post_ids:
        description: "Optional comma-separated WordPress post IDs to move to trash before publishing"
        required: false
        default: ""
  schedule:
    - cron: '47 5 * * *'
    - cron: '17 0 * * *'
    - cron: '17 3 * * *'
    - cron: '17 6 * * *'
    - cron: '17 9 * * *'
    - cron: '17 11 * * *'
    - cron: '17 14 * * *'
    - cron: '17 16 * * *'
    - cron: '17 18 * * *'
    - cron: '17 20 * * *'
    - cron: '17 22 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/publish-trigger.json'

concurrency:
  group: small-model-publish
  cancel-in-progress: false

env:
  AI_PROVIDER: openrouter
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  WORDPRESS_SITE_URL: ${{ secrets.TECHSIGNAL_URL }}
  WORDPRESS_USERNAME: ${{ secrets.TECHSIGNAL_USERNAME }}
  WORDPRESS_APP_PASSWORD: ${{ secrets.TECHSIGNAL_APP_PASSWORD }}
  ENABLE_MULTI_RUN_SCHEDULE: 'true'
  ENABLE_SAME_DAY_DEDUP: 'true'
  WORDPRESS_PUBLISH_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish == 'true' }}
  WORDPRESS_DEFAULT_STATUS: ${{ (github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish == 'true') && 'publish' || (secrets.WORDPRESS_DEFAULT_STATUS || 'draft') }}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Clean up superseded posts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cleanup_post_ids != '' }}
        env:
          CLEANUP_POST_IDS: ${{ inputs.cleanup_post_ids }}
        run: |
          python - <<'PY'
          import os, requests
          site = os.environ["WORDPRESS_SITE_URL"].rstrip("/")
          auth = (os.environ["WORDPRESS_USERNAME"], os.environ["WORDPRESS_APP_PASSWORD"])
          for post_id in [x.strip() for x in os.environ["CLEANUP_POST_IDS"].split(",") if x.strip()]:
              r = requests.delete(f"{site}/wp-json/wp/v2/posts/{post_id}", params={"force":"false"}, auth=auth, timeout=30)
              r.raise_for_status()
              print(f"Moved WordPress post {post_id} to trash")
          PY
      - name: Check multi-run feature flag
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ env.ENABLE_MULTI_RUN_SCHEDULE }}" != "true" ] && [ "${{ github.event.schedule }}" != '17 6 * * *' ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"schema_version":"1.0","stage":"schedule_gate","success":true,"published":false,"reason":"multi-run disabled"}' > validation-report.json
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve scheduled topic slot
        id: trigger
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              '17 0 * * *') SLOT=0 ;;
              '17 3 * * *') SLOT=1 ;;
              '17 6 * * *') SLOT=2 ;;
              '17 9 * * *') SLOT=3 ;;
              '17 11 * * *') SLOT=4 ;;
              '17 14 * * *') SLOT=5 ;;
              '17 16 * * *') SLOT=6 ;;
              '17 18 * * *') SLOT=7 ;;
              '17 20 * * *') SLOT=8 ;;
              '17 22 * * *') SLOT=9 ;;
              *) echo "Unknown publication schedule slot"; exit 1 ;;
            esac
            DAY_OF_YEAR=$(date -u +%j)
            TOPIC_COUNT=$(python -c 'from generate import load_topics; print(len(load_topics()))')
            TARGET=$(python -c 'import json; print(json.load(open("data/scaling_state.json", encoding="utf-8")).get("recommended_target", 5))')
            if [ "$SLOT" -ge "$TARGET" ]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              printf '%s\n' "{\"schema_version\":\"1.0\",\"stage\":\"scale_gate\",\"success\":true,\"published\":false,\"reason\":\"slot outside current target\",\"slot\":$SLOT,\"target\":$TARGET}" > validation-report.json
              echo "Scale gate: slot $SLOT blocked; target is $TARGET/day"
              exit 0
            fi
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            TOPIC_INDEX=$(( ((10#$DAY_OF_YEAR - 1) * 10 + SLOT) % TOPIC_COUNT ))
            echo "topic_index=$TOPIC_INDEX" >> "$GITHUB_OUTPUT"
            echo "Expanded topic catalogue size: $TOPIC_COUNT"
            echo "Scheduled slot $SLOT -> topic index $TOPIC_INDEX; target $TARGET/day"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            TOPIC_INDEX=$(python -c 'import json; print(json.load(open(".github/publish-trigger.json", encoding="utf-8"))["topic_index"])')
            echo "topic_index=$TOPIC_INDEX" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "topic_index=${{ inputs.topic_index || '0' }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Run complete pipeline
        if: steps.gate.outputs.should_run == 'true' && steps.trigger.outputs.should_run != 'false'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then
            python pipeline.py --topic-index "${{ steps.trigger.outputs.topic_index }}" --enable-dedup --publish --output validation-report.json
          else
            python pipeline.py --topic-index "${{ steps.trigger.outputs.topic_index }}" --output validation-report.json
          fi
      - name: Record run metric
        if: always() && steps.gate.outputs.should_run == 'true' && steps.trigger.outputs.should_run != 'false'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/run_metrics.json")
          rows = json.loads(p.read_text(encoding="utf-8")) if p.exists() else []
          report = json.loads(Path("validation-report.json").read_text(encoding="utf-8")) if Path("validation-report.json").exists() else {}
          validation = report.get("validation_report", report).get("validation", {})
          rows.append({"run_id": "${{ github.run_id }}", "timestamp": "${{ github.run_started_at }}", "validation_passed": validation.get("passed") is True, "dedup_rejected": report.get("stage") == "dedup_skip", "success": report.get("success", validation.get("passed", False))})
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(rows[-500:], indent=2) + "\n", encoding="utf-8")
          PY
      - name: Persist rolling publish history and run metrics
        if: ${{ always() && steps.gate.outputs.should_run == 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish == 'true') }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published_history.json data/run_metrics.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist publishing metrics"
            git push
          fi
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: small-model-validation-report-${{ github.run_id }}
          path: validation-report.json
          if-no-files-found: error

  measure:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '47 5 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect metrics and update scale
        env:
          TECHSIGNAL_URL: ${{ secrets.TECHSIGNAL_URL }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: python metrics_collector.py
      - name: Persist scaling state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scaling_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update adaptive publishing target"
            git push
          fi
