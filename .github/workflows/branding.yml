name: TechSignal Branding

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apply_branding.py'
      - 'assets/logo.png'
      - '.github/workflows/branding.yml'

permissions:
  contents: read

jobs:
  branding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install requests
        run: pip install requests
      - name: Apply and verify branding
        env:
          WORDPRESS_SITE_URL: ${{ secrets.TECHSIGNAL_URL }}
          WORDPRESS_USERNAME: ${{ secrets.TECHSIGNAL_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.TECHSIGNAL_APP_PASSWORD }}
        run: python apply_branding.py
